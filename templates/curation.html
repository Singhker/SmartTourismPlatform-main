{% extends "base.html" %} {% block title %}Data Curation{% endblock %} {% block
content %}
<div class="container py-4">
  <h2>Data Curation Dashboard</h2>

  <div class="row mb-4">
    <div class="col-md-6">
      <form method="GET" class="d-flex gap-2">
        <select name="dataset" class="form-select">
          <option value="tourist_places">Tourist Places</option>
          <option value="visitor_statistics">Visitor Statistics</option>
          <option value="reviews">Reviews</option>
          <option value="hotels">Hotels</option>
          <option value="restaurants">Restaurants</option>
          <option value="events">Events</option>
          <option value="weather">Weather</option>
        </select>
        <button type="submit" class="btn btn-primary">Load</button>
      </form>
    </div>
  </div>

  <div class="alert alert-info">
    Select a dataset above to view quality report.
  </div>

  <a href="{{ url_for('places') }}" class="btn btn-outline-secondary">
    Back to Places
  </a>
</div>
{% endblock %}
